<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">洞洞板模块连接总览</title>
  <desc id="desc">ESP32-S3 开发板连接一个小洞洞板模块，洞洞板上焊接 PC817 和电阻，鼠标内部只引出 GND、侧键信号和左键信号。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .h { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .t { font: 500 20px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2937; }
      .s { font: 500 17px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 3; rx: 18; }
      .module { fill: #ecfdf5; stroke: #15803d; stroke-width: 4; rx: 18; }
      .sub { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; rx: 10; }
      .pin { stroke: #ffffff; stroke-width: 2; }
      .gnd { fill: #111827; }
      .side { fill: #2563eb; }
      .left { fill: #16a34a; }
      .drive { fill: #ea580c; }
      .wire-gnd { stroke: #111827; stroke-width: 5; fill: none; }
      .wire-side { stroke: #2563eb; stroke-width: 5; fill: none; }
      .wire-left { stroke: #16a34a; stroke-width: 5; fill: none; }
      .wire-drive { stroke: #ea580c; stroke-width: 5; fill: none; }
      .wire-usb { stroke: #64748b; stroke-width: 6; fill: none; }
      .note { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 12; }
    </style>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="820"/>
  <text class="title" x="700" y="58" text-anchor="middle">洞洞板实现方式：做一个小的“光耦转接模块”</text>

  <rect class="box" x="70" y="145" width="330" height="420"/>
  <text class="h" x="235" y="190" text-anchor="middle">Logitech G102</text>
  <text class="s" x="235" y="220" text-anchor="middle">鼠标保持原 USB 连接电脑</text>
  <rect class="sub" x="115" y="285" width="240" height="56"/>
  <circle class="pin gnd" cx="145" cy="313" r="9"/>
  <text class="t" x="175" y="320">鼠标 GND</text>
  <rect class="sub" x="115" y="365" width="240" height="56"/>
  <circle class="pin side" cx="145" cy="393" r="9"/>
  <text class="t" x="175" y="400">侧键信号</text>
  <rect class="sub" x="115" y="445" width="240" height="56"/>
  <circle class="pin left" cx="145" cy="473" r="9"/>
  <text class="t" x="175" y="480">左键信号</text>

  <rect class="module" x="540" y="125" width="320" height="520"/>
  <text class="h" x="700" y="170" text-anchor="middle">小洞洞板模块</text>
  <text class="s" x="700" y="200" text-anchor="middle">约 2 cm × 3 cm，可裁剪</text>
  <rect class="sub" x="585" y="250" width="230" height="74"/>
  <text class="t" x="700" y="282" text-anchor="middle">PC817 / EL817</text>
  <text class="s" x="700" y="308" text-anchor="middle">DIP-4 直插光耦</text>
  <rect class="sub" x="585" y="355" width="230" height="66"/>
  <text class="t" x="700" y="386" text-anchor="middle">470R</text>
  <text class="s" x="700" y="411" text-anchor="middle">GPIO5 到 PC817 1脚</text>
  <rect class="sub" x="585" y="450" width="230" height="66"/>
  <text class="t" x="700" y="481" text-anchor="middle">47k</text>
  <text class="s" x="700" y="506" text-anchor="middle">侧键到 GPIO4</text>
  <rect class="sub" x="585" y="545" width="230" height="66"/>
  <text class="t" x="700" y="576" text-anchor="middle">100k 下拉</text>
  <text class="s" x="700" y="601" text-anchor="middle">GPIO5 到 GND</text>

  <rect class="box" x="1000" y="145" width="330" height="420"/>
  <text class="h" x="1165" y="190" text-anchor="middle">ESP32-S3 开发板</text>
  <text class="s" x="1165" y="220" text-anchor="middle">单独 USB 供电 / 烧录 / 调试</text>
  <rect class="sub" x="1045" y="285" width="240" height="56"/>
  <circle class="pin gnd" cx="1075" cy="313" r="9"/>
  <text class="t" x="1105" y="320">GND</text>
  <rect class="sub" x="1045" y="365" width="240" height="56"/>
  <circle class="pin side" cx="1075" cy="393" r="9"/>
  <text class="t" x="1105" y="400">GPIO4</text>
  <rect class="sub" x="1045" y="445" width="240" height="56"/>
  <circle class="pin drive" cx="1075" cy="473" r="9"/>
  <text class="t" x="1105" y="480">GPIO5</text>

  <path class="wire-gnd" d="M355 313 C440 313 465 313 540 313" marker-end="url(#arrow-black)"/>
  <path class="wire-side" d="M355 393 C445 393 470 474 540 483" marker-end="url(#arrow-blue)"/>
  <path class="wire-left" d="M355 473 C445 473 470 285 540 287" marker-end="url(#arrow-green)"/>
  <path class="wire-gnd" d="M860 313 C930 313 955 313 1045 313" marker-end="url(#arrow-black)"/>
  <path class="wire-side" d="M860 483 C940 483 955 393 1045 393" marker-end="url(#arrow-blue)"/>
  <path class="wire-drive" d="M860 388 C940 388 955 473 1045 473" marker-end="url(#arrow-orange)"/>

  <path class="wire-usb" d="M235 565 C280 710 1075 710 1165 565"/>
  <text class="s" x="700" y="704" text-anchor="middle">两台设备各自通过 USB 接电脑；鼠标 5V 不接 ESP32，洞洞板只连接信号和 GND。</text>

  <rect class="note" x="425" y="675" width="550" height="80"/>
  <text class="t" x="700" y="710" text-anchor="middle">最终成品不需要把 ESP32 焊上洞洞板</text>
  <text class="s" x="700" y="738" text-anchor="middle">洞洞板只承载 PC817 和电阻，ESP32 仍保留开发板形态。</text>
</svg>
