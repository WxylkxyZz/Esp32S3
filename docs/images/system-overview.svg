<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">ESP32-S3 与 Logitech G102 总体连接结构</title>
  <desc id="desc">电脑两个 USB 口分别连接鼠标和 ESP32-S3，鼠标内部只引出 GND、侧键信号和左键信号，不连接鼠标 5V。</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #243447; stroke-width: 3; rx: 18; }
      .subpanel { fill: #f8fbff; stroke: #8aa1b4; stroke-width: 2; rx: 12; }
      .title { font: 700 34px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #17212b; }
      .section { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #17212b; }
      .text { font: 500 20px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #243447; }
      .small { font: 500 17px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #4b5f70; }
      .pin { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #ffffff; }
      .wire-gnd { stroke: #1f2937; stroke-width: 5; fill: none; }
      .wire-side { stroke: #2563eb; stroke-width: 5; fill: none; }
      .wire-left { stroke: #16a34a; stroke-width: 5; fill: none; }
      .wire-usb { stroke: #6b7280; stroke-width: 6; fill: none; }
      .wire-no { stroke: #dc2626; stroke-width: 5; fill: none; stroke-dasharray: 12 10; }
      .note { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 10; }
      .danger { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 10; }
      .ok { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .dot-gnd { fill: #1f2937; }
      .dot-side { fill: #2563eb; }
      .dot-left { fill: #16a34a; }
      .dot-usb { fill: #6b7280; }
      .dot-no { fill: #dc2626; }
    </style>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="860"/>
  <text class="title" x="700" y="56" text-anchor="middle">总体结构：ESP32-S3 单独供电，鼠标只引出三根信号线</text>

  <rect class="panel" x="55" y="115" width="250" height="360"/>
  <text class="section" x="180" y="158" text-anchor="middle">电脑</text>
  <rect class="subpanel" x="95" y="200" width="170" height="74"/>
  <text class="text" x="180" y="231" text-anchor="middle">USB 口 1</text>
  <text class="small" x="180" y="257" text-anchor="middle">接 G102</text>
  <rect class="subpanel" x="95" y="330" width="170" height="74"/>
  <text class="text" x="180" y="361" text-anchor="middle">USB 口 2</text>
  <text class="small" x="180" y="387" text-anchor="middle">接 ESP32-S3</text>

  <rect class="panel" x="420" y="95" width="390" height="470"/>
  <text class="section" x="615" y="138" text-anchor="middle">Logitech G102 鼠标内部</text>
  <rect class="subpanel" x="465" y="190" width="300" height="82"/>
  <text class="text" x="615" y="223" text-anchor="middle">侧键微动</text>
  <text class="small" x="615" y="250" text-anchor="middle">信号端：未按下高电平，按下 0V</text>
  <rect class="subpanel" x="465" y="320" width="300" height="82"/>
  <text class="text" x="615" y="353" text-anchor="middle">左键微动</text>
  <text class="small" x="615" y="380" text-anchor="middle">保留原功能，不切断原线路</text>
  <rect class="subpanel" x="465" y="455" width="300" height="68"/>
  <text class="text" x="615" y="493" text-anchor="middle">鼠标 GND</text>

  <rect class="panel" x="945" y="130" width="360" height="360"/>
  <text class="section" x="1125" y="173" text-anchor="middle">ESP32-S3 开发板</text>
  <rect class="subpanel" x="990" y="220" width="270" height="70"/>
  <text class="text" x="1125" y="251" text-anchor="middle">GPIO4 输入</text>
  <text class="small" x="1125" y="276" text-anchor="middle">读取侧键状态</text>
  <rect class="subpanel" x="990" y="325" width="270" height="70"/>
  <text class="text" x="1125" y="356" text-anchor="middle">GPIO5 输出</text>
  <text class="small" x="1125" y="381" text-anchor="middle">驱动 PC817 输入侧</text>
  <rect class="subpanel" x="990" y="420" width="270" height="42"/>
  <text class="text" x="1125" y="448" text-anchor="middle">GND</text>

  <rect class="panel" x="942" y="590" width="366" height="155"/>
  <text class="section" x="1125" y="632" text-anchor="middle">PC817 / EL817 光耦</text>
  <text class="text" x="1125" y="672" text-anchor="middle">输出侧并联在左键微动上</text>
  <text class="small" x="1125" y="704" text-anchor="middle">导通时：左键信号线被拉到 GND</text>

  <path class="wire-usb" d="M265 237 C330 237 350 237 420 237" marker-end="url(#arrow-gray)"/>
  <text class="small" x="342" y="219" text-anchor="middle">G102 原 USB 线</text>
  <path class="wire-usb" d="M265 367 C535 610 735 190 945 310" marker-end="url(#arrow-gray)"/>
  <text class="small" x="604" y="612" text-anchor="middle">ESP32-S3 USB 供电 / 烧录 / 调试</text>

  <circle class="dot-side" cx="765" cy="231" r="8"/>
  <path class="wire-side" d="M765 231 C850 231 900 255 990 255" marker-end="url(#arrow-blue)"/>
  <text class="small" x="878" y="218" text-anchor="middle">侧键信号线</text>

  <circle class="dot-left" cx="765" cy="361" r="8"/>
  <path class="wire-left" d="M765 361 C855 420 905 605 942 657" marker-end="url(#arrow-green)"/>
  <text class="small" x="855" y="505" text-anchor="middle">左键信号线</text>

  <circle class="dot-gnd" cx="765" cy="489" r="8"/>
  <path class="wire-gnd" d="M765 489 C845 489 900 441 990 441" marker-end="url(#arrow-black)"/>
  <path class="wire-gnd" d="M765 489 C855 560 900 705 942 705" marker-end="url(#arrow-black)"/>
  <text class="small" x="850" y="475" text-anchor="middle">鼠标 GND</text>

  <path class="wire-left" d="M1125 590 C1125 520 1125 465 1125 395" marker-end="url(#arrow-green)"/>
  <text class="small" x="1218" y="535" text-anchor="middle">GPIO5 控制</text>

  <rect class="danger" x="430" y="615" width="410" height="98"/>
  <text class="text" x="635" y="650" text-anchor="middle">鼠标 USB 5V 不接 ESP32</text>
  <text class="small" x="635" y="680" text-anchor="middle">避免两个 USB 口的 5V 被外部导线并联回灌</text>
  <path class="wire-no" d="M625 565 C650 600 690 610 800 610"/>
  <line x1="805" y1="595" x2="835" y2="625" stroke="#dc2626" stroke-width="6"/>
  <line x1="835" y1="595" x2="805" y2="625" stroke="#dc2626" stroke-width="6"/>

  <rect class="ok" x="75" y="620" width="275" height="125"/>
  <text class="text" x="212" y="657" text-anchor="middle">鼠标内部只引出</text>
  <circle class="dot-gnd" cx="115" cy="690" r="8"/><text class="small" x="143" y="696">GND</text>
  <circle class="dot-side" cx="115" cy="720" r="8"/><text class="small" x="143" y="726">侧键信号线</text>
  <circle class="dot-left" cx="235" cy="720" r="8"/><text class="small" x="263" y="726">左键信号线</text>
</svg>
