<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">硬件已齐全后的虚拟接线操作图</title>
  <desc id="desc">展示 Logitech G102 鼠标、洞洞板小模块和 ESP32-S3 之间的实际焊线关系。鼠标只引出 GND、侧键信号和左键信号，不连接鼠标 5V。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #1f2937; stroke-width: 3; rx: 16; }
      .module { fill: #eefdf3; stroke: #15803d; stroke-width: 3; rx: 16; }
      .sub { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; rx: 10; }
      .chip { fill: #eef2ff; stroke: #4338ca; stroke-width: 3; rx: 10; }
      .res { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
      .warn { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 10; }
      .ok { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .note { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .title { font: 700 34px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .h { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .t { font: 500 19px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2937; }
      .s { font: 500 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .pinLabel { font: 700 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #ffffff; }
      .wire-gnd { stroke: #111827; stroke-width: 5; fill: none; }
      .wire-side { stroke: #2563eb; stroke-width: 5; fill: none; }
      .wire-left { stroke: #16a34a; stroke-width: 5; fill: none; }
      .wire-drive { stroke: #ea580c; stroke-width: 5; fill: none; }
      .wire-no { stroke: #dc2626; stroke-width: 5; fill: none; stroke-dasharray: 12 10; }
      .node { stroke: #ffffff; stroke-width: 2; }
      .gnd { fill: #111827; }
      .side { fill: #2563eb; }
      .left { fill: #16a34a; }
      .drive { fill: #ea580c; }
      .no { fill: #dc2626; }
    </style>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>
  <text class="title" x="800" y="58" text-anchor="middle">硬件已齐全后的虚拟接线图：先照这个关系排线，再焊接</text>
  <text class="s" x="800" y="92" text-anchor="middle">适用于侧键未按下约 3.3V 的常见版本；如果侧键是 5V，只替换 GPIO4 输入部分，见右下角分压框。</text>

  <rect class="panel" x="70" y="150" width="390" height="600"/>
  <text class="h" x="265" y="192" text-anchor="middle">Logitech G102 鼠标 PCB</text>
  <text class="s" x="265" y="222" text-anchor="middle">鼠标原 USB 线仍直接插电脑</text>

  <rect class="sub" x="125" y="260" width="280" height="74"/>
  <text class="t" x="265" y="292" text-anchor="middle">M-GND 鼠标地</text>
  <text class="s" x="265" y="318" text-anchor="middle">USB 黑线 / 大面积铺铜</text>
  <circle class="node gnd" cx="405" cy="297" r="9"/>

  <rect class="sub" x="125" y="380" width="280" height="74"/>
  <text class="t" x="265" y="412" text-anchor="middle">SIDE 侧键信号</text>
  <text class="s" x="265" y="438" text-anchor="middle">未按下高电平，按下 0V</text>
  <circle class="node side" cx="405" cy="417" r="9"/>

  <rect class="sub" x="125" y="500" width="280" height="74"/>
  <text class="t" x="265" y="532" text-anchor="middle">LEFT 左键信号</text>
  <text class="s" x="265" y="558" text-anchor="middle">PC817 输出侧并联到这里</text>
  <circle class="node left" cx="405" cy="537" r="9"/>

  <rect class="warn" x="125" y="635" width="280" height="72"/>
  <text class="t" x="265" y="666" text-anchor="middle">鼠标 5V 不接 ESP32</text>
  <text class="s" x="265" y="692" text-anchor="middle">只从鼠标引出三根线</text>
  <path class="wire-no" d="M405 670 C475 670 510 705 560 725"/>
  <line x1="550" y1="710" x2="585" y2="745" stroke="#dc2626" stroke-width="6"/>
  <line x1="585" y1="710" x2="550" y2="745" stroke="#dc2626" stroke-width="6"/>

  <rect class="module" x="560" y="135" width="520" height="650"/>
  <text class="h" x="820" y="180" text-anchor="middle">洞洞板小模块</text>
  <text class="s" x="820" y="210" text-anchor="middle">先焊模块，测试通过后再固定进外壳</text>

  <rect class="chip" x="735" y="430" width="170" height="210"/>
  <text class="h" x="820" y="468" text-anchor="middle">PC817</text>
  <text class="s" x="820" y="494" text-anchor="middle">缺口朝上</text>
  <circle class="node drive" cx="760" cy="515" r="15"/><text class="pinLabel" x="760" y="521" text-anchor="middle">1</text>
  <circle class="node gnd" cx="760" cy="595" r="15"/><text class="pinLabel" x="760" y="601" text-anchor="middle">2</text>
  <circle class="node left" cx="880" cy="515" r="15"/><text class="pinLabel" x="880" y="521" text-anchor="middle">4</text>
  <circle class="node gnd" cx="880" cy="595" r="15"/><text class="pinLabel" x="880" y="601" text-anchor="middle">3</text>

  <rect class="res" x="620" y="387" width="130" height="60"/>
  <text class="t" x="685" y="412" text-anchor="middle">R1</text>
  <text class="s" x="685" y="436" text-anchor="middle">47k</text>

  <rect class="res" x="925" y="485" width="130" height="60"/>
  <text class="t" x="990" y="510" text-anchor="middle">R2</text>
  <text class="s" x="990" y="534" text-anchor="middle">470Ω</text>

  <rect class="res" x="925" y="605" width="130" height="60"/>
  <text class="t" x="990" y="630" text-anchor="middle">R3</text>
  <text class="s" x="990" y="654" text-anchor="middle">100k</text>

  <rect class="note" x="610" y="260" width="420" height="70"/>
  <text class="t" x="820" y="290" text-anchor="middle">黑线是公共 GND 母线</text>
  <text class="s" x="820" y="316" text-anchor="middle">鼠标 GND、ESP32 GND、PC817 2/3脚都接到这里</text>

  <rect class="panel" x="1190" y="170" width="330" height="500"/>
  <text class="h" x="1355" y="212" text-anchor="middle">ESP32-S3 开发板</text>
  <text class="s" x="1355" y="242" text-anchor="middle">单独 USB 供电 / 烧录 / 调试</text>

  <rect class="sub" x="1240" y="330" width="230" height="64"/>
  <text class="t" x="1355" y="369" text-anchor="middle">GPIO4 输入</text>
  <circle class="node side" cx="1240" cy="362" r="9"/>

  <rect class="sub" x="1240" y="455" width="230" height="64"/>
  <text class="t" x="1355" y="494" text-anchor="middle">GPIO5 输出</text>
  <circle class="node drive" cx="1240" cy="487" r="9"/>

  <rect class="sub" x="1240" y="580" width="230" height="64"/>
  <text class="t" x="1355" y="619" text-anchor="middle">GND</text>
  <circle class="node gnd" cx="1240" cy="612" r="9"/>

  <path class="wire-gnd" d="M405 297 H610 V295 H1030 V612 H1240" marker-end="url(#arrow-black)"/>
  <path class="wire-gnd" d="M820 295 V595 H760"/>
  <path class="wire-gnd" d="M820 295 V595 H880"/>
  <path class="wire-side" d="M405 417 H620"/>
  <path class="wire-side" d="M750 417 H1130 V362 H1240" marker-end="url(#arrow-blue)"/>
  <path class="wire-left" d="M405 537 H650 V515 H880" marker-end="url(#arrow-green)"/>
  <path class="wire-drive" d="M1240 487 H1055" marker-end="url(#arrow-orange)"/>
  <path class="wire-drive" d="M925 515 H760" marker-end="url(#arrow-orange)"/>
  <path class="wire-drive" d="M1240 487 V635 H1055"/>
  <path class="wire-gnd" d="M925 635 H820"/>

  <rect class="ok" x="70" y="820" width="285" height="90"/>
  <text class="t" x="212" y="854" text-anchor="middle">1. 先测点并贴标签</text>
  <text class="s" x="212" y="882" text-anchor="middle">M-GND / SIDE / LEFT</text>

  <rect class="ok" x="385" y="820" width="285" height="90"/>
  <text class="t" x="527" y="854" text-anchor="middle">2. 先焊洞洞板</text>
  <text class="s" x="527" y="882" text-anchor="middle">PC817、R1、R2、R3</text>

  <rect class="ok" x="700" y="820" width="285" height="90"/>
  <text class="t" x="842" y="854" text-anchor="middle">3. 断电蜂鸣检查</text>
  <text class="s" x="842" y="882" text-anchor="middle">确认无短路再通电</text>

  <rect class="ok" x="1015" y="820" width="285" height="90"/>
  <text class="t" x="1157" y="854" text-anchor="middle">4. 鼠标单独测试</text>
  <text class="s" x="1157" y="882" text-anchor="middle">左键、侧键、移动正常</text>

  <rect class="ok" x="1330" y="820" width="200" height="90"/>
  <text class="t" x="1430" y="854" text-anchor="middle">5. 低频测试</text>
  <text class="s" x="1430" y="882" text-anchor="middle">再做连点固件</text>

  <rect class="warn" x="1138" y="690" width="382" height="96"/>
  <text class="t" x="1329" y="724" text-anchor="middle">如果 SIDE 未按下是 5V</text>
  <text class="s" x="1329" y="752" text-anchor="middle">R1 不装，改为：SIDE -> 220k -> GPIO4，GPIO4 -> 330k -> GND</text>
  <text class="s" x="1329" y="776" text-anchor="middle">左键 PC817 部分不变</text>
</svg>
