<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PC817 光耦引脚与本项目连接方向</title>
  <desc id="desc">PC817 顶视图，1脚接 GPIO5 通过 470R，2脚接 ESP32 GND，4脚接鼠标左键信号线，3脚接鼠标 GND。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .h { font: 700 25px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .t { font: 500 20px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2937; }
      .s { font: 500 17px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .chip { fill: #eef2ff; stroke: #4338ca; stroke-width: 4; rx: 18; }
      .pin { fill: #4338ca; }
      .pinText { font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #ffffff; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .left { stroke: #ea580c; stroke-width: 5; fill: none; }
      .right { stroke: #16a34a; stroke-width: 5; fill: none; }
      .gnd { stroke: #111827; stroke-width: 5; fill: none; }
      .note { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 10; }
      .ok { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; rx: 10; }
    </style>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="760"/>
  <text class="title" x="600" y="56" text-anchor="middle">PC817 引脚方向与本项目接法</text>

  <rect class="chip" x="430" y="155" width="340" height="390"/>
  <path d="M540 155 C540 195 660 195 660 155" fill="#f8fafc" stroke="#4338ca" stroke-width="4"/>
  <text class="h" x="600" y="235" text-anchor="middle">PC817 / EL817</text>
  <text class="s" x="600" y="265" text-anchor="middle">DIP-4 顶视图</text>
  <text class="s" x="600" y="295" text-anchor="middle">从有缺口/圆点的一侧判断脚位</text>

  <circle class="pin" cx="430" cy="245" r="22"/>
  <circle class="pin" cx="430" cy="455" r="22"/>
  <circle class="pin" cx="770" cy="245" r="22"/>
  <circle class="pin" cx="770" cy="455" r="22"/>
  <text class="pinText" x="430" y="252" text-anchor="middle">1</text>
  <text class="pinText" x="430" y="462" text-anchor="middle">2</text>
  <text class="pinText" x="770" y="252" text-anchor="middle">4</text>
  <text class="pinText" x="770" y="462" text-anchor="middle">3</text>

  <rect class="box" x="60" y="175" width="300" height="120"/>
  <text class="h" x="210" y="214" text-anchor="middle">1脚：LED 正极</text>
  <text class="t" x="210" y="248" text-anchor="middle">经 470R 接 GPIO5</text>
  <text class="s" x="210" y="275" text-anchor="middle">GPIO5 HIGH 时导通</text>
  <path class="left" d="M360 235 H408" marker-end="url(#arrow-orange)"/>

  <rect class="box" x="60" y="405" width="300" height="105"/>
  <text class="h" x="210" y="444" text-anchor="middle">2脚：LED 负极</text>
  <text class="t" x="210" y="478" text-anchor="middle">接 ESP32 GND</text>
  <path class="gnd" d="M360 455 H408" marker-end="url(#arrow-black)"/>

  <rect class="box" x="840" y="175" width="300" height="120"/>
  <text class="h" x="990" y="214" text-anchor="middle">4脚：Collector</text>
  <text class="t" x="990" y="248" text-anchor="middle">接鼠标左键信号线</text>
  <text class="s" x="990" y="275" text-anchor="middle">不要接到 GND</text>
  <path class="right" d="M792 245 H840" marker-end="url(#arrow-green)"/>

  <rect class="box" x="840" y="405" width="300" height="105"/>
  <text class="h" x="990" y="444" text-anchor="middle">3脚：Emitter</text>
  <text class="t" x="990" y="478" text-anchor="middle">接鼠标 GND</text>
  <path class="gnd" d="M792 455 H840" marker-end="url(#arrow-black)"/>

  <rect class="ok" x="190" y="605" width="820" height="78"/>
  <text class="t" x="600" y="637" text-anchor="middle">正确输出方向：4脚接左键信号线，3脚接鼠标 GND</text>
  <text class="s" x="600" y="664" text-anchor="middle">GPIO5 点亮输入 LED 后，输出侧把左键信号线拉低，等效按下左键。</text>
</svg>
